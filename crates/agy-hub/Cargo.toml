[package]
name = "agy-hub"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Multi-User Team"]
description = "Central Authentication, Systemd Lifecycle & Dynamic Reverse Proxy Hub for Antigravity Server"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio", "server-auto"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
thiserror = "1.0"
bytes = "1.6"
base64 = "0.22"
sha1 = "0.10"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
agy-core = { path = "../agy-core" }
agy-proxy = { path = "../agy-proxy" }

[target.'cfg(target_os = "linux")'.dependencies]
pam = "0.8"
uzers = "0.11"
nix = { version = "0.29", features = ["user"] }
zbus = { version = "4.4", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
tempfile = "3.10"
tokio-tungstenite = "0.21"
futures-util = "0.3"

