[package]
name = "agy-cli"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Multi-User Team"]
description = "Antigravity Server Management & Doctor Diagnostic CLI"

[[bin]]
name = "agy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
agy-core = { path = "../agy-core" }
agy-proxy = { path = "../agy-proxy" }
thiserror = "1.0"
chrono = { version = "0.4" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
